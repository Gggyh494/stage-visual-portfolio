<body>
  <main class="shell content-section">
    <p class="mono eyebrow">PORTFOLIO EDITOR</p>
    <div class="section-header"><div><h2>作品集素材管理</h2></div></div>
    <p>在本机管理页选择素材位置和新文件，预览后点「上传并发布」。工具使用电脑上已有的 GitHub 登录，并自动更新所选位置。</p>
    <p class="admin-links"><a class="button button-primary" href="http://127.0.0.1:8794/_editor/">打开本机管理页 ↗</a> <a class="button button-secondary" href="https://github.com/Gggyh494/stage-visual-portfolio/archive/refs/heads/main.zip">下载管理工具 ↗</a> <a class="button button-secondary" href="../">返回作品集</a></p>
    <p>首次使用时，解压后双击 <strong>start-github-admin.cmd</strong>。电脑需安装 Node.js 22 或更新版本及 Git，并已用有仓库写权限的账号登录 Git。</p>
    <p class="admin-links"><a class="button button-secondary" href="https://github.com/Gggyh494/stage-visual-portfolio/tree/main/docs/media">打开 GitHub 素材库 ↗</a></p>
    <p>也可以登录 GitHub，在素材所在目录上传同名、同格式的文件，再提交到 main。仓库里共用该文件的位置会一起更新。</p>
  </main>
